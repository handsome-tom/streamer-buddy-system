<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamer Buddy System</title>
  <!-- The phone deck (?deck) can be added to a home screen like an app. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/deck-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Streamer Deck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0e0e10">
  <style>html, body { margin: 0; background: #0e0e10; }</style>
</head>
<body>
  <header class="bar">
    <!-- One profile-picture dot per connection (OBS's dock title already says
         Streamer Buddy System). -->
    <div class="dots" id="dots"></div>
    <!-- In a one-row dock: send right here (Enter sends); quick questions beside it. -->
    <form class="qa" id="quickAsk" hidden>
      <select class="qa__to" id="quickTo" title="Who to send to"></select>
      <input class="qa__text" id="quickText" type="text" maxlength="200" placeholder="Message…" autocomplete="off" spellcheck="false"
             name="hub-quick-ask" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">
    </form>
    <div class="quick" id="quick" hidden></div>
    <!-- Quick info, !vanish notes and flagged chat, each for a moment. -->
    <div class="flashes" id="flashes"></div>
    <span class="bar__status" id="status" title=""></span>
    <!-- The newest question (or answer), with its answers, right in the bar. -->
    <div class="peek" id="peek"></div>
    <button class="pill pill--icon" id="askFull" type="button" title="Open the full Ask window" aria-label="Open the full Ask window" hidden>
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 3h6v6M17 3l-7 7M8 4H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4"/>
      </svg>
    </button>
    <!-- Side panel only: how connections see you (online, idle, offline). -->
    <button class="pill presence" id="presenceBtn" type="button" hidden></button>
    <!-- Side panel only: Mod (the green sword). The stream you're on: the streamer's feed,
         their reactions to you and your thread with them (dock.js, modPanel). -->
    <button class="pill pill--icon mod-btn" id="modBtn" type="button" title="Mod" aria-label="Mod" hidden>
      <svg viewBox="-0.5 -0.5 21 21" width="16" height="16" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M19.4 0.6 L13.8 1.6 L5.4 12.8 L7.2 14.6 L18.4 6.2 Z M15.4 4.6 L6.75 12.85 L7.15 13.25 Z"/><g stroke="#fff" stroke-linecap="round" fill="none"><path d="M3.5 12.3 L7.7 16.5" stroke-width="1.8"/><path d="M5.6 14.4 L2.4 17.6" stroke-width="1.5"/></g><circle cx="1.5" cy="18.5" r="1.3" fill="#fff"/></svg>
    </button>
    <button class="pill" id="askBtn" type="button" hidden>Ask</button>
    <button class="pill pill--icon" id="statsBtn" type="button" title="Stats" aria-label="Stats" hidden>
      <svg class="px-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges"><path d="M10 2h3v1h-3zM10 3h3v1h-3zM10 4h3v1h-3zM6 5h3v1h-3zM10 5h3v1h-3zM6 6h3v1h-3zM10 6h3v1h-3zM6 7h3v1h-3zM10 7h3v1h-3zM2 8h3v1h-3zM6 8h3v1h-3zM10 8h3v1h-3zM2 9h3v1h-3zM6 9h3v1h-3zM10 9h3v1h-3zM2 10h3v1h-3zM6 10h3v1h-3zM10 10h3v1h-3zM2 11h3v1h-3zM6 11h3v1h-3zM10 11h3v1h-3zM2 12h3v1h-3zM6 12h3v1h-3zM10 12h3v1h-3zM1 13h13v1h-13z"/></svg>
    </button>
    <button class="pill pill--icon" id="chatBtn" type="button" title="Mod chat" aria-label="Mod chat" hidden>
      <svg class="px-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges"><path d="M1 1h9v1h-9zM0 2h11v1h-11zM0 3h11v1h-11zM0 4h3v1h-3zM5 4h1v1h-1zM8 4h1v1h-1zM11 4h1v1h-1zM0 5h11v1h-11zM0 6h11v1h-11zM12 6h3v1h-3zM1 7h9v1h-9zM15 7h1v1h-1zM1 8h2v1h-2zM5 8h1v1h-1zM15 8h1v1h-1zM1 9h1v1h-1zM3 9h1v1h-1zM5 9h1v1h-1zM15 9h1v1h-1zM1 10h2v1h-2zM5 10h1v1h-1zM15 10h1v1h-1zM1 11h1v1h-1zM6 11h9v1h-9zM11 12h1v1h-1zM13 12h1v1h-1zM12 13h2v1h-2zM13 14h1v1h-1z"/></svg>
    </button>
    <!-- The streamer's chat dock: back to the stream chat from any menu. -->
    <button class="pill pill--icon" id="homeChatBtn" type="button" title="Back to chat" aria-label="Back to chat" hidden>
      <svg class="px-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges"><path d="M2 2h12v1h-12zM1 3h1v1h-1zM14 3h1v1h-1zM1 4h1v1h-1zM14 4h1v1h-1zM1 5h1v1h-1zM14 5h1v1h-1zM1 6h1v1h-1zM4 6h2v1h-2zM7 6h2v1h-2zM10 6h2v1h-2zM14 6h1v1h-1zM1 7h1v1h-1zM14 7h1v1h-1zM1 8h1v1h-1zM14 8h1v1h-1zM2 9h2v1h-2zM5 9h9v1h-9zM3 10h1v1h-1zM5 10h1v1h-1zM3 11h2v1h-2zM3 12h1v1h-1z"/></svg>
    </button>
    <!-- The streamer's OBS docks: Do Not Disturb (15 minutes, or until clicked off). -->
    <button class="pill pill--icon dnd-btn" id="dndBtn" type="button" title="Do Not Disturb" aria-label="Do Not Disturb" aria-pressed="false" hidden>
      <svg class="px-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges"><path d="M7 0h2v1h-2zM7 1h2v1h-2zM7 2h2v1h-2zM7 3h2v1h-2zM7 4h2v1h-2zM7 5h2v1h-2zM7 6h2v1h-2zM4 7h2v1h-2zM7 7h2v1h-2zM10 7h2v1h-2zM13 7h2v1h-2zM4 8h11v1h-11zM1 9h2v1h-2zM4 9h11v1h-11zM1 10h3v1h-3zM5 10h10v1h-10zM2 11h13v1h-13zM3 12h11v1h-11zM4 13h9v1h-9zM5 14h7v1h-7z"/></svg>
      <span class="dnd-btn__label" id="dndLabel"></span>
    </button>
    <!-- Side panel: Messages (one-on-one and group chats), honey, between Mod and Connections. -->
    <button class="pill pill--icon msg-btn" id="msgBtn" type="button" title="Messages" aria-label="Messages" hidden>
      <svg class="px-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges"><path d="M6 2h4v1h-4zM5 3h6v1h-6zM5 4h6v1h-6zM5 5h6v1h-6zM5 6h6v1h-6zM6 7h4v1h-4zM3 9h10v1h-10zM2 10h12v1h-12zM2 11h12v1h-12zM2 12h12v1h-12zM2 13h12v1h-12z"/></svg>
      <span class="pill__count" id="msgCount"></span>
    </button>
    <button class="pill pill--icon" id="peopleBtn" type="button" title="Connections" aria-label="Connections" hidden>
      <svg class="px-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges"><path d="M4 3h3v1h-3zM10 3h3v1h-3zM3 4h5v1h-5zM9 4h5v1h-5zM3 5h5v1h-5zM9 5h5v1h-5zM3 6h5v1h-5zM9 6h5v1h-5zM4 7h3v1h-3zM10 7h3v1h-3zM2 9h7v1h-7zM10 9h5v1h-5zM1 10h9v1h-9zM11 10h4v1h-4zM1 11h9v1h-9zM11 11h4v1h-4zM1 12h9v1h-9zM11 12h4v1h-4z"/></svg>
      <span class="pill__count" id="chatCount"></span>
    </button>
    <!-- OBS docks: settings (dock.js, "Settings"). -->
    <button class="pill pill--icon settings-btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings" aria-haspopup="true" hidden>
      <svg class="px-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges"><path d="M6 1h4v1h-4zM2 2h2v1h-2zM6 2h4v1h-4zM12 2h2v1h-2zM2 3h12v1h-12zM3 4h10v1h-10zM3 5h10v1h-10zM1 6h5v1h-5zM10 6h5v1h-5zM1 7h5v1h-5zM10 7h5v1h-5zM1 8h5v1h-5zM10 8h5v1h-5zM1 9h5v1h-5zM10 9h5v1h-5zM3 10h10v1h-10zM3 11h10v1h-10zM2 12h12v1h-12zM2 13h2v1h-2zM6 13h4v1h-4zM12 13h2v1h-2zM6 14h4v1h-4z"/></svg>
    </button>
    <div class="settings" id="settings" role="dialog" aria-label="Settings" hidden></div>
    <div class="dnd-menu" id="dndMenu" role="menu" aria-label="Do Not Disturb" hidden></div>
  </header>

  <!-- Flagged chat lines, pinned for a while (dock.js). -->
  <div class="pins" id="pins"></div>

  <!-- Side panel: Streamer View, what the streamer's OBS dock shows now (dock.js). -->
  <section class="sv" id="streamerView" hidden></section>

  <main id="main"></main>

  <!-- ?livechat: Twitch's own chat, below everything above (dock.js adds it). -->
  <section class="live" id="live" hidden></section>

  <!-- OBS keeps old copies of pages for a while, so the files are loaded under
       the current version.txt; a new version is picked up on the next load.
       Bump version.txt with every change. -->
  <script>
    // The extension tells this page which channel its Twitch tab is on as soon as the frame
    // loads, which is before dock.js (loaded below, after version.txt) is listening, and it
    // doesn't say again until the tab changes. Keep anything that arrives early; dock.js
    // hands it on once it's ready.
    window.EARLY_MESSAGES = [];
    window.EARLY_CATCH = (e) => window.EARLY_MESSAGES.push({ data: e.data, origin: e.origin, source: e.source });
    addEventListener("message", window.EARLY_CATCH);
  </script>
  <script>
    (async () => {
      let v = "0";
      try {
        v = (await (await fetch(`version.txt?t=${Date.now()}`, { cache: "no-store" })).text()).trim();
      } catch {}
      window.DOCK_VERSION = v;
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = `dock.css?v=${v}`;
      document.head.append(css);
      // ownchat.js is optional: if it doesn't load, the chat dock uses Twitch's chat.
      // Inside the public demo (demo/): its pretend relay, Twitch and storage come first.
      const demo = new URLSearchParams(location.search).has("sandbox") && window.parent !== window;
      for (const src of [...(demo ? ["demo/sandbox.js"] : []), "config.js", "ownchat.js", "dock.js"]) {
        await new Promise((done) => {
          const s = document.createElement("script");
          s.src = `${src}?v=${v}`;
          s.onload = s.onerror = done;
          document.body.append(s);
        });
      }
    })();
  </script>
</body>
</html>
