<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamer Buddy System</title>
  <style>html, body { margin: 0; background: #0e0e10; }</style>
</head>
<body>
  <header class="bar">
    <!-- One profile-picture dot per connection (OBS's dock title already says
         Streamer Buddy System). -->
    <div class="dots" id="dots"></div>
    <span class="bar__status" id="status" title=""></span>
    <!-- The newest question (or answer), with its answers, right in the bar. -->
    <div class="peek" id="peek"></div>
    <button class="pill" id="askBtn" type="button" hidden>Ask</button>
    <button class="pill pill--icon" id="peopleBtn" type="button" title="Connections" aria-label="Connections" hidden>
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="7.5" cy="6.5" r="3"/><path d="M2 17c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
        <circle cx="14" cy="7.5" r="2.4"/><path d="M14.5 12.2c2.2.3 3.8 2 3.8 4.3"/>
      </svg>
    </button>
  </header>

  <main id="main"></main>

  <!-- OBS keeps old copies of pages for a while, so the files are loaded under
       the current version.txt; a new version is picked up on the next load.
       Bump version.txt with every change. -->
  <script>
    (async () => {
      let v = "0";
      try {
        v = (await (await fetch("version.txt", { cache: "no-store" })).text()).trim();
      } catch {}
      window.DOCK_VERSION = v;
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = `dock.css?v=${v}`;
      document.head.append(css);
      for (const src of ["config.js", "dock.js"]) {
        await new Promise((done) => {
          const s = document.createElement("script");
          s.src = `${src}?v=${v}`;
          s.onload = s.onerror = done;
          document.body.append(s);
        });
      }
    })();
  </script>
</body>
</html>
