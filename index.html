<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamer Buddy System</title>
  <!-- The phone deck (?deck) can be added to a home screen like an app. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/deck-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Streamer Deck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0e0e10">
  <style>html, body { margin: 0; background: #0e0e10; }</style>
</head>
<body>
  <header class="bar">
    <!-- One profile-picture dot per connection (OBS's dock title already says
         Streamer Buddy System). -->
    <div class="dots" id="dots"></div>
    <!-- In a one-row dock: send right here (Enter sends); quick questions beside it. -->
    <form class="qa" id="quickAsk" hidden>
      <select class="qa__to" id="quickTo" title="Who to send to"></select>
      <input class="qa__text" id="quickText" type="text" maxlength="200" placeholder="Message…" autocomplete="off" spellcheck="false"
             name="hub-quick-ask" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">
    </form>
    <div class="quick" id="quick" hidden></div>
    <!-- Quick info, !vanish notes and flagged chat, each for a moment. -->
    <div class="flashes" id="flashes"></div>
    <span class="bar__status" id="status" title=""></span>
    <!-- The newest question (or answer), with its answers, right in the bar. -->
    <div class="peek" id="peek"></div>
    <button class="pill pill--icon" id="askFull" type="button" title="Open the full Ask window" aria-label="Open the full Ask window" hidden>
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 3h6v6M17 3l-7 7M8 4H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4"/>
      </svg>
    </button>
    <!-- Side panel only: how connections see you (online, idle, offline). -->
    <button class="pill presence" id="presenceBtn" type="button" hidden></button>
    <button class="pill" id="askBtn" type="button" hidden>Ask</button>
    <button class="pill pill--icon" id="statsBtn" type="button" title="Stats" aria-label="Stats" hidden>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 16v-5M10 16V5M16 16v-8"/></svg>
    </button>
    <button class="pill pill--icon" id="chatBtn" type="button" title="Mod chat" aria-label="Mod chat" hidden>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <path d="M3 4h10v7H7l-3 2.5V11H3z"/><path d="M13 7h4v7h-1v2.5L13 14H9v-1"/>
      </svg>
    </button>
    <!-- The streamer's chat dock: back to the stream chat from any menu. -->
    <button class="pill pill--icon" id="homeChatBtn" type="button" title="Back to chat" aria-label="Back to chat" hidden>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M3 4.5h14v9H8.5L5 16.5v-3H3z"/>
      </svg>
    </button>
    <!-- The streamer's OBS docks: Do Not Disturb (15 minutes, or until clicked off). -->
    <button class="pill pill--icon dnd-btn" id="dndBtn" type="button" title="Do Not Disturb" aria-label="Do Not Disturb" aria-pressed="false" hidden>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M8.6 9V3.2a1.4 1.4 0 0 1 2.8 0V9"/>
        <path d="M8.6 9.2V8a1.3 1.3 0 0 0-2.6 0v1.6M6 9.4a1.3 1.3 0 0 0-2.4.7v1.8c0 3.2 2.3 5.6 5.4 5.6h1.6c2.8 0 5-2.2 5-5V9.6a1.3 1.3 0 0 0-2.6 0V9a1.3 1.3 0 0 0-2.6 0"/>
      </svg>
      <span class="dnd-btn__label" id="dndLabel"></span>
    </button>
    <button class="pill pill--icon" id="peopleBtn" type="button" title="Connections" aria-label="Connections" hidden>
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="7.5" cy="6.5" r="3"/><path d="M2 17c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
        <circle cx="14" cy="7.5" r="2.4"/><path d="M14.5 12.2c2.2.3 3.8 2 3.8 4.3"/>
      </svg>
      <span class="pill__count" id="chatCount"></span>
    </button>
    <!-- OBS docks: settings (dock.js, "Settings"). -->
    <button class="pill pill--icon settings-btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings" aria-haspopup="true" hidden>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="2.5"/>
        <path d="M8.6 2.5h2.8l.4 2.1 1.5.8 2-.8 1.4 2.4-1.6 1.4v1.7l1.6 1.4-1.4 2.4-2-.8-1.5.8-.4 2.1H8.6l-.4-2.1-1.5-.8-2 .8-1.4-2.4 1.6-1.4V9.3L3.3 7.9l1.4-2.4 2 .8 1.5-.8z"/>
      </svg>
    </button>
    <div class="settings" id="settings" role="dialog" aria-label="Settings" hidden></div>
    <div class="dnd-menu" id="dndMenu" role="menu" aria-label="Do Not Disturb" hidden></div>
  </header>

  <!-- Flagged chat lines, pinned for a while (dock.js). -->
  <div class="pins" id="pins"></div>

  <!-- Side panel: Streamer View, what the streamer's OBS dock shows now (dock.js). -->
  <section class="sv" id="streamerView" hidden></section>

  <main id="main"></main>

  <!-- ?livechat: Twitch's own chat, below everything above (dock.js adds it). -->
  <section class="live" id="live" hidden></section>

  <!-- OBS keeps old copies of pages for a while, so the files are loaded under
       the current version.txt; a new version is picked up on the next load.
       Bump version.txt with every change. -->
  <script>
    (async () => {
      let v = "0";
      try {
        v = (await (await fetch("version.txt", { cache: "no-store" })).text()).trim();
      } catch {}
      window.DOCK_VERSION = v;
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = `dock.css?v=${v}`;
      document.head.append(css);
      // ownchat.js is optional: if it doesn't load, the chat dock uses Twitch's chat.
      // Inside the public demo (demo/): its pretend relay, Twitch and storage come first.
      const demo = new URLSearchParams(location.search).has("sandbox") && window.parent !== window;
      for (const src of [...(demo ? ["demo/sandbox.js"] : []), "config.js", "ownchat.js", "dock.js"]) {
        await new Promise((done) => {
          const s = document.createElement("script");
          s.src = `${src}?v=${v}`;
          s.onload = s.onerror = done;
          document.body.append(s);
        });
      }
    })();
  </script>
</body>
</html>
