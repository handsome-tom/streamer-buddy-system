<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/mark.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<title>Testing Playground · StreamSpace</title>
<meta name="description" content="Both StreamSpace demos with their click-through tours, on plain black. Everyone here is pretend.">
<!--
  The Testing Playground: the two demos (play.html) on their own, black page, nothing else.
  ?plain turns off the space backdrop, the floating labels and the starry tour box.
  The first demo loads straight away; the mod walkthrough loads as you scroll toward it.
-->
<style>
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400 800; font-display: swap; src: url("../fonts/plus-jakarta-sans.woff2") format("woff2"); }
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #efeff1; font: 14px/1.5 "Plus Jakarta Sans", Inter, "Helvetica Neue", Arial, sans-serif; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 18px 16px; }
  .top h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .top nav { display: flex; gap: 18px; font-size: 13px; }
  .top a { color: #9a9aa5; text-decoration: none; }
  .top a:hover { color: #fff; }
  .pg { position: relative; padding: 24px 0 48px; }
  .pg + .pg { border-top: 1px solid #1a1a1f; }
  .pg iframe { display: block; width: 100%; height: 1400px; border: 0; background: #000; }
  .pg__wait { position: absolute; top: 60px; left: 0; right: 0; margin: 0; text-align: center; color: #6d6d78; }
  .pg__wait[hidden] { display: none; }
</style>
</head>
<body>
  <header class="top">
    <h1>Testing Playground</h1>
    <nav><a href="#streamer">Streamer's side</a><a href="#mod">Mod walkthrough</a><a href="./">Back to the site</a></nav>
  </header>

  <section class="pg" id="streamer" aria-label="Streamer's side demo">
    <iframe id="f1" data-src="play.html?embed&amp;plain" title="Live demo: the streamer's side"></iframe>
    <p class="pg__wait" id="w1">Loading the demo…</p>
  </section>

  <section class="pg" id="mod" aria-label="Mod walkthrough">
    <iframe id="f2" data-src="play.html?embed&amp;plain&amp;story=mod" title="Mod walkthrough"></iframe>
    <p class="pg__wait" id="w2">Loading the mod walkthrough…</p>
  </section>

<script>
  (() => {
    const frames = [["f1", "w1"], ["f2", "w2"]].map(([f, w]) => [document.getElementById(f), document.getElementById(w)]);
    // Each demo says how tall it is; its frame follows.
    addEventListener("message", (e) => {
      if (e.origin !== location.origin || e.data?.t !== "demo-height") return;
      for (const [f, w] of frames) if (e.source === f.contentWindow) { f.style.height = `${Math.ceil(e.data.h)}px`; w.hidden = true; }
    });
    const load = (f) => { if (!f.src) f.src = f.dataset.src; };
    load(frames[0][0]);
    const mod = frames[1][0];
    if (location.hash === "#mod" || !("IntersectionObserver" in window)) load(mod);
    else {
      const io = new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting)) { io.disconnect(); load(mod); } }, { rootMargin: "600px 0px" });
      io.observe(mod);
    }
    addEventListener("hashchange", () => location.hash === "#mod" && load(mod));
  })();
</script>
</body>
</html>
